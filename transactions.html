<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transactions | SecureBank</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="layout">
        <div id="sidebar-root"></div>
        <div class="main">
            <div id="topbar-root"></div>
            <div class="content">

                <!-- account selector + balance -->
                <div class="card mb-16">
                    <div class="toolbar" style="margin-bottom:0">
                        <div class="form-group" style="margin-bottom:0;min-width:320px">
                            <label>Select account</label>
                            <select id="accountSelect"></select>
                        </div>
                        <div style="flex:1"></div>
                        <div style="text-align:right">
                            <div class="muted small">Available balance</div>
                            <div class="stat-value" id="balanceDisplay">-</div>
                            <div class="muted small" id="accountMeta"></div>
                        </div>
                        <div class="flex" id="accountActions">
                            <button class="btn btn-success" id="depositBtn" onclick="openActionModal('deposit')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M3 20h18"/></svg> Deposit
                            </button>
                            <button class="btn btn-outline" id="withdrawBtn" onclick="openActionModal('withdraw')">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M3 20h18"/></svg> Withdraw
                            </button>
                        </div>
                    </div>
                </div>

                <!-- transaction history -->
                <div class="card">
                    <div class="card-header">
                        <div>
                            <h2>Transaction History</h2>
                            <div class="sub" id="historyMeta">Select an account to see activity</div>
                        </div>
                    </div>
                    <div class="table-wrap" id="transactionsTable">
                        <div class="table-empty">Select an account to view transactions.</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="overlay-backdrop" id="backdrop"></div>
    <div id="toast-container"></div>

    <!-- ============ DEPOSIT / WITHDRAW MODAL ============ -->
    <div class="modal-overlay" id="actionModal" onclick="openModalIfEscaped(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 id="actionTitle">Deposit</h3>
                <button class="modal-close" onclick="closeModal('actionModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Account</label>
                    <input type="text" id="actionAccount" disabled />
                </div>
                <div class="form-group">
                    <label>Amount (₹) *</label>
                    <input type="number" id="actionAmount" min="0.01" step="0.01" placeholder="0.00" />
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <input type="text" id="actionDescription" placeholder="e.g. Salary credit / ATM withdrawal" />
                </div>
                <div class="form-error" id="actionError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('actionModal')">Cancel</button>
                <button class="btn" id="actionSubmitBtn" onclick="submitAction()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
