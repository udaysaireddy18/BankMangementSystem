<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers | SecureBank</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="layout">
        <div id="sidebar-root"></div>
        <div class="main">
            <div id="topbar-root"></div>
            <div class="content">

                <!-- toolbar -->
                <div class="toolbar">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
                        <input type="text" id="searchInput" placeholder="Search by name, email or phone..." />
                    </div>
                    <div class="flex">
                        <span class="toolbar-meta" id="countMeta"></span>
                        <button class="btn" onclick="openCustomerModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add Customer</button>
                    </div>
                </div>

                <!-- customers table -->
                <div class="card">
                    <div class="table-wrap" id="customersTable">
                        <div class="loading-row" id="loading">Loading customers...</div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="overlay-backdrop" id="backdrop"></div>
    <div id="toast-container"></div>

    <!-- ============ ADD / EDIT MODAL ============ -->
    <div class="modal-overlay" id="customerModal" onclick="openModalIfEscaped(event)">
        <div class="modal">
            <div class="modal-header">
                <h3 id="customerModalTitle">Add Customer</h3>
                <button class="modal-close" onclick="closeModal('customerModal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="customerId" />
                <div class="form-grid">
                    <div class="form-group">
                        <label>First name *</label>
                        <input type="text" id="cFirstName" placeholder="John" />
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" id="cLastName" placeholder="Doe" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="cEmail" placeholder="john@example.com" />
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" id="cPhone" placeholder="10-digit mobile" />
                    </div>
                    <div class="form-group full">
                        <label>Address</label>
                        <input type="text" id="cAddress" placeholder="Street, City" />
                    </div>
                    <div class="form-group">
                        <label>Date of birth</label>
                        <input type="date" id="cDob" />
                    </div>
                    <div class="form-group">
                        <label>Linked login</label>
                        <select id="cUserId">
                            <option value="">-- None (no login) --</option>
                        </select>
                        <div class="form-help">Optional: link an existing registered user.</div>
                    </div>
                </div>
                <div class="form-error" id="customerError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('customerModal')">Cancel</button>
                <button class="btn" id="saveCustomerBtn" onclick="saveCustomer()">Save customer</button>
            </div>
        </div>
    </div>

    <!-- ============ VIEW MODAL ============ -->
    <div class="modal-overlay" id="viewModal" onclick="openModalIfEscaped(event)">
        <div class="modal">
            <div class="modal-header">
                <h3>Customer Details</h3>
                <button class="modal-close" onclick="closeModal('viewModal')">&times;</button>
            </div>
            <div class="modal-body" id="viewBody"></div>
        </div>
    </div>

    <!-- ============ DELETE CONFIRM ============ -->
    <div class="modal-overlay" id="deleteModal" onclick="openModalIfEscaped(event)">
        <div class="modal" style="max-width:400px">
            <div class="modal-header"><h3>Delete customer?</h3></div>
            <div class="modal-body">
                <p>This will permanently remove <b id="deleteName"></b> and
                   <b>all of their accounts and transactions</b>. This action cannot be undone.</p>
                <div class="form-error" id="deleteError"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('deleteModal')">Cancel</button>
                <button class="btn btn-danger" id="deleteBtn" onclick="deleteCustomer()">Delete forever</button>
            </div>
        </div>
    </div>

    <script src="vendor/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/customers.js"></script>
</body>
</html>
