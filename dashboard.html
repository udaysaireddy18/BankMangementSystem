<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | SecureBank</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="layout">
        <div id="sidebar-root"></div>
        <div class="main">
            <div id="topbar-root"></div>
            <div class="content">

                <!-- quick actions -->
                <div class="toolbar" id="quickActions"></div>

                <!-- stat cards -->
                <div class="stats-grid" id="statsGrid"></div>

                <!-- customer accounts (shown when logged in as customer) -->
                <div id="customerAccounts"></div>

                <div class="grid-2">
                    <!-- recent transactions -->
                    <div class="card">
                        <div class="card-header">
                            <div>
                                <h2>Recent Transactions</h2>
                                <div class="sub">Latest activity in the bank</div>
                            </div>
                            <a class="btn btn-ghost btn-sm" href="transactions.html">View all</a>
                        </div>
                        <div class="table-wrap" id="recentTransactions"></div>
                    </div>

                    <!-- recent customers (admin) -->
                    <div class="card" id="recentCustomersCard">
                        <div class="card-header">
                            <div>
                                <h2>Recently Added Customers</h2>
                                <div class="sub">Newest registered customers</div>
                            </div>
                            <a class="btn btn-ghost btn-sm" href="customers.html">Manage</a>
                        </div>
                        <div class="table-wrap" id="recentCustomers"></div>
                    </div>
                </div>

                <!-- 7 day cash flow chart -->
                <div class="card mt-16">
                    <div class="card-header">
                        <div>
                            <h2>Cash Flow - Last 7 Days</h2>
                            <div class="sub">Deposits vs Withdrawals</div>
                        </div>
                    </div>
                    <div id="miniChart"></div>
                </div>

            </div>
        </div>
    </div>

    <div class="overlay-backdrop" id="backdrop"></div>
    <div id="toast-container"></div>

    <script src="vendor/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
