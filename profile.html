<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | SecureBank</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <div class="layout">
        <div id="sidebar-root"></div>
        <div class="main">
            <div id="topbar-root"></div>
            <div class="content">

                <div class="grid-2">

                    <!-- profile card -->
                    <div class="card">
                        <div class="card-header">
                            <div><h2>My Profile</h2><div class="sub">Your login information</div></div>
                        </div>

                        <div class="flex" style="margin-bottom:20px">
                            <div class="avatar" style="width:64px;height:64px;font-size:22px" id="profileAvatar">?</div>
                            <div>
                                <div style="font-weight:700;font-size:18px" id="profileName">-</div>
                                <div class="muted small" id="profileEmail">-</div>
                                <span class="role-chip" id="profileRole">-</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Display name</label>
                            <input type="text" id="editName" />
                        </div>
                        <div class="form-error" id="nameError"></div>
                        <button class="btn btn-outline" onclick="updateName()">Update name</button>

                        <hr style="border:none;border-top:1px solid var(--border);margin:22px 0" />

                        <h3 style="font-size:15px;margin-bottom:12px">Change password</h3>
                        <div class="form-group">
                            <label>New password</label>
                            <input type="password" id="newPassword" placeholder="Min 6 characters" />
                        </div>
                        <div class="form-group">
                            <label>Confirm new password</label>
                            <input type="password" id="confirmPassword" placeholder="Re-enter new password" />
                        </div>
                        <div class="form-error" id="passwordError"></div>
                        <button class="btn" onclick="changePassword()">Update password</button>

                        <hr style="border:none;border-top:1px solid var(--border);margin:22px 0" />

                        <button class="btn btn-danger" onclick="signOut()">Logout</button>
                    </div>

                    <!-- linked customer info -->
                    <div class="card">
                        <div class="card-header">
                            <div><h2>Linked Customer Record</h2><div class="sub">Your details in the bank</div></div>
                        </div>
                        <div id="customerSection">
                            <div class="loading-row">Loading...</div>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <div class="overlay-backdrop" id="backdrop"></div>
    <div id="toast-container"></div>

    <script src="vendor/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
